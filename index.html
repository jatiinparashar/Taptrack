<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TapTrack – Create Your Own Online Counter</title>

    <meta name="description"
          content="Create your own free online counter with TapTrack. Name your counter, set a goal and start counting instantly. No signup or download required.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(124,58,237,0.25),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 10%,
                    rgba(79,70,229,0.20),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #07070c,
                    #10101a 55%,
                    #171329
                );

            overflow-x: hidden;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            padding: 22px 7%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            position: relative;

            z-index: 10;
        }


        .logo {

            font-size: 28px;

            font-weight: 900;

            letter-spacing: -1px;
        }


        .logo span {

            color: #8b5cf6;
        }


        nav a {

            color: #a1a1aa;

            text-decoration: none;

            margin-left: 24px;

            font-size: 14px;

            transition: 0.2s;
        }


        nav a:hover {

            color: white;
        }


        /* =========================
           HERO
        ========================= */

        .hero {

            text-align: center;

            padding: 75px 20px 45px;
        }


        .badge {

            display: inline-block;

            padding: 9px 17px;

            border-radius: 50px;

            background:
                rgba(124,58,237,0.12);

            border:
                1px solid
                rgba(139,92,246,0.3);

            color: #c4b5fd;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 25px;
        }


        .hero h1 {

            font-size:
                clamp(45px, 8vw, 80px);

            line-height: 0.95;

            letter-spacing: -4px;

            margin-bottom: 25px;
        }


        .hero h1 span {

            color: #8b5cf6;
        }


        .hero p {

            max-width: 650px;

            margin: auto;

            color: #a1a1aa;

            font-size: 18px;

            line-height: 1.7;
        }


        /* =========================
           CREATOR
        ========================= */

        .creator-section {

            display: flex;

            justify-content: center;

            padding: 30px 20px 80px;
        }


        .creator-card {

            width: min(94%, 620px);

            padding: 35px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.12);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.5);

            backdrop-filter: blur(20px);
        }


        .creator-header {

            text-align: center;

            margin-bottom: 30px;
        }


        .creator-header h2 {

            font-size: 28px;

            margin-bottom: 8px;
        }


        .creator-header p {

            color: #a1a1aa;

            font-size: 14px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            color: #d4d4d8;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 9px;
        }


        input {

            width: 100%;

            padding: 15px 16px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            background:
                rgba(0,0,0,0.25);

            color: white;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }


        input:focus {

            border-color: #8b5cf6;

            box-shadow:
                0 0 0 3px
                rgba(139,92,246,0.12);
        }


        .number-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }


        /* =========================
           ICON PICKER
        ========================= */

        .emoji-grid {

            display: grid;

            grid-template-columns:
                repeat(8, 1fr);

            gap: 8px;
        }


        .emoji {

            height: 48px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.04);

            font-size: 22px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: 0.15s;
        }


        .emoji:hover {

            background:
                rgba(139,92,246,0.18);

            transform: translateY(-2px);
        }


        .emoji.selected {

            border-color: #8b5cf6;

            background:
                rgba(139,92,246,0.25);

            box-shadow:
                0 0 15px
                rgba(139,92,246,0.2);
        }


        /* =========================
           CREATE BUTTON
        ========================= */

        .create-button {

            width: 100%;

            padding: 17px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            color: white;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 8px;

            box-shadow:
                0 15px 35px
                rgba(124,58,237,0.3);

            transition: 0.2s;
        }


        .create-button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 20px 45px
                rgba(124,58,237,0.45);
        }


        /* =========================
           COUNTER
        ========================= */

        .counter-section {

            display: none;

            justify-content: center;

            padding: 20px 20px 90px;
        }


        .counter-card {

            width: min(94%, 620px);

            padding: 40px 30px;

            text-align: center;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.13);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.55);

            backdrop-filter: blur(20px);
        }


        .counter-icon {

            font-size: 65px;

            margin-bottom: 10px;

            animation:
                floating 3s
                ease-in-out
                infinite;
        }


        @keyframes floating {

            0%,100% {

                transform:
                    translateY(0);
            }

            50% {

                transform:
                    translateY(-8px);
            }
        }


        .counter-name {

            font-size: 14px;

            color: #a78bfa;

            font-weight: bold;

            letter-spacing: 2px;

            text-transform: uppercase;

            margin-bottom: 12px;
        }


        #count {

            font-size: 105px;

            font-weight: 900;

            letter-spacing: -5px;

            line-height: 1;

            margin: 10px 0 32px;
        }


        .tap-row {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;
        }


        .side-button {

            width: 60px;

            height: 60px;

            border: none;

            border-radius: 18px;

            background: #27213f;

            color: #c4b5fd;

            font-size: 26px;

            cursor: pointer;

            transition: 0.15s;
        }


        .side-button:hover {

            background: #352b54;
        }


        .side-button:active {

            transform: scale(0.9);
        }


        .tap-button {

            width: 190px;

            height: 70px;

            border: none;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            color: white;

            font-size: 19px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 15px 35px
                rgba(124,58,237,0.4);

            transition: 0.15s;
        }


        .tap-button:hover {

            transform:
                translateY(-3px)
                scale(1.02);
        }


        .tap-button:active {

            transform:
                scale(0.94);
        }


        /* =========================
           PROGRESS
        ========================= */

        .goal {

            margin-top: 32px;
        }


        .goal-header {

            display: flex;

            justify-content: space-between;

            margin-bottom: 10px;

            color: #a1a1aa;

            font-size: 13px;
        }


        .progress {

            height: 12px;

            background: #27272a;

            border-radius: 50px;

            overflow: hidden;
        }


        #progressBar {

            height: 100%;

            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #7c3aed,
                    #a78bfa
                );

            border-radius: 50px;

            transition:
                width 0.3s;
        }


        #message {

            margin-top: 15px;

            color: #c4b5fd;

            font-size: 14px;

            font-weight: bold;
        }


        /* =========================
           ACTIONS
        ========================= */

        .actions {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 9px;

            margin-top: 23px;
        }


        .action-button {

            border: none;

            padding: 11px 15px;

            border-radius: 11px;

            background: #211c31;

            color: #c4b5fd;

            cursor: pointer;

            font-size: 13px;

            transition: 0.15s;
        }


        .action-button:hover {

            background: #30274a;
        }


        /* =========================
           SAVED COUNTERS
        ========================= */

        .saved-section {

            max-width: 950px;

            margin: auto;

            padding: 0 20px 90px;

            display: none;
        }


        .saved-title {

            text-align: center;

            margin-bottom: 25px;
        }


        .saved-title h2 {

            font-size: 30px;

            margin-bottom: 7px;
        }


        .saved-title p {

            color: #a1a1aa;

            font-size: 14px;
        }


        .saved-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }


        .saved-card {

            padding: 22px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.08);

            transition: 0.2s;
        }


        .saved-card:hover {

            transform:
                translateY(-4px);

            background:
                rgba(255,255,255,0.08);
        }


        .saved-card-top {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 15px;
        }


        .saved-icon {

            font-size: 30px;
        }


        .saved-name {

            font-weight: bold;

            word-break: break-word;
        }


        .saved-count {

            font-size: 30px;

            font-weight: 900;

            margin-bottom: 14px;
        }


        .saved-buttons {

            display: flex;

            gap: 7px;
        }


        .saved-buttons button {

            flex: 1;

            padding: 9px;

            border: none;

            border-radius: 9px;

            background: #252039;

            color: #c4b5fd;

            cursor: pointer;

            font-size: 12px;
        }


        .saved-buttons button:hover {

            background: #352b54;
        }


        /* =========================
           HOW IT WORKS
        ========================= */

        .how {

            padding: 90px 20px;

            text-align: center;

            border-top:
                1px solid
                rgba(255,255,255,0.06);
        }


        .how h2 {

            font-size: 38px;

            margin-bottom: 12px;
        }


        .how-sub {

            color: #a1a1aa;

            margin-bottom: 45px;
        }


        .steps {

            max-width: 950px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 20px;
        }


        .step {

            padding: 30px 20px;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid
                rgba(255,255,255,0.07);
        }


        .step-number {

            width: 45px;

            height: 45px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                rgba(124,58,237,0.2);

            color: #c4b5fd;

            font-weight: 900;
        }


        .step h3 {

            margin-bottom: 8px;
        }


        .step p {

            color: #a1a1aa;

            font-size: 13px;

            line-height: 1.6;
        }


        /* =========================
           ABOUT
        ========================= */

        .about {

            max-width: 750px;

            margin: auto;

            text-align: center;

            padding: 20px 20px 90px;
        }


        .about h2 {

            font-size: 32px;

            margin-bottom: 18px;
        }


        .about p {

            color: #a1a1aa;

            line-height: 1.8;

            font-size: 15px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            border-top:
                1px solid
                rgba(255,255,255,0.07);

            padding: 30px 20px;

            text-align: center;

            color: #71717a;

            font-size: 13px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {

                padding: 20px;
            }


            nav a {

                margin-left: 10px;
            }


            .hero {

                padding-top: 50px;
            }


            .hero h1 {

                letter-spacing: -2px;
            }


            .creator-card {

                padding: 27px 18px;
            }


            .emoji-grid {

                grid-template-columns:
                    repeat(4,1fr);
            }


            .number-row {

                grid-template-columns:
                    1fr;
            }


            .counter-card {

                padding:
                    32px 18px;
            }


            #count {

                font-size: 82px;
            }


            .tap-button {

                width: 150px;
            }


            .saved-grid {

                grid-template-columns:
                    1fr;
            }


            .steps {

                grid-template-columns:
                    1fr;
            }
        }


        @media (max-width: 400px) {

            .tap-button {

                width: 135px;
            }


            .side-button {

                width: 52px;

                height: 55px;
            }
        }

    </style>

</head>


<body>
